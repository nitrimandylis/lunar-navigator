<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 138" role="img" aria-label="Selini, the MoonFromEarth tour guide: a small astronaut.">
  <!-- Selini, the tour guide. The same drawing as components/buddy.tsx, on a dark
       tile so it reads on a light page too. -->
  <style>
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .bob { animation: bob 3s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    .light { animation: glow 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .bob, .eye, .light { animation: none; } }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
  </style>
  <rect width="120" height="138" rx="14" fill="#0f1a21"/>
  <g transform="translate(20 12) scale(1.25)">
    <g class="bob">
      <path d="M32 11V4" stroke="#f2f2f2" stroke-width="2" stroke-linecap="round"/>
      <circle class="light" cx="32" cy="3.5" r="3" fill="#fe7743"/>
      <path d="M44 51q9-3 10-13" fill="none" stroke="#f2f2f2" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 51q-7 2-8 9" fill="none" stroke="#f2f2f2" stroke-width="3" stroke-linecap="round"/>
      <rect x="21.5" y="63" width="8" height="6" rx="2.5" fill="#f2f2f2"/>
      <rect x="34.5" y="63" width="8" height="6" rx="2.5" fill="#f2f2f2"/>
      <rect x="20" y="45" width="24" height="20" rx="8" fill="#162630" stroke="#f2f2f2" stroke-width="2"/>
      <circle class="light" cx="32" cy="55" r="2.5" fill="#4f8db0"/>
      <circle cx="32" cy="29" r="18" fill="#162630" stroke="#f2f2f2" stroke-width="2"/>
      <rect x="18.5" y="20" width="27" height="17" rx="8.5" fill="#0f1a21" stroke="#273f4f"/>
      <ellipse class="eye" cx="26.5" cy="28" rx="2.3" ry="3" fill="#f2f2f2"/>
      <ellipse class="eye" cx="37.5" cy="28" rx="2.3" ry="3" fill="#f2f2f2"/>
      <path d="M29 33.5q3 2 6 0" fill="none" stroke="#f2f2f2" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
  <text x="60" y="124" font-size="15" font-weight="700" fill="#f2f2f2">Selini</text>
</svg>
